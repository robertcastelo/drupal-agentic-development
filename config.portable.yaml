# Portable custom settings merged into config.yaml by DDEV (config.*.yaml files
# are merged on top of the generated config.yaml). Kept tracked so fresh clones
# inherit the environment-critical settings, while name/type/docroot stay local
# (generated by `ddev config --project-type=drupal10 --docroot=web`).

php_version: "8.4"
webserver_type: nginx-fpm
composer_version: "2"
corepack_enable: true
nodejs_version: "24"
use_dns_when_possible: true
upload_dirs:
  - sites/default/files
  - ../node_modules
database:
    type: mariadb
    version: "11.8"

# Build the OpenChamber image if it isn't already present locally. The
# openchamber service in docker-compose.openchamber.yaml uses `image:
# openchamber:local`, so on a fresh machine (or after image pruning) we must
# (re)build it before the container can start.
hooks:
  pre-start:
    - exec-host: |
        if ! docker image inspect openchamber:local >/dev/null 2>&1; then
          .ddev/openchamber/build.sh
        fi
