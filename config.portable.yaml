# Portable custom settings merged into config.yaml by DDEV (config.*.yaml files
# are merged on top of the generated config.yaml). Kept tracked so fresh clones
# inherit the environment-critical settings, while name/type/docroot stay local
# (generated by `ddev config --project-type=drupal12 --docroot=web`).

corepack_enable: true
nodejs_version: "24"
use_dns_when_possible: true
upload_dirs:
  - sites/default/files
  - ../node_modules

# Build the OpenChamber image if it isn't present locally or was built from an
# older pinned tag. The openchamber service in docker-compose.openchamber.yaml
# uses `image: openchamber:local`, so on a fresh machine, after image pruning,
# or after a version bump in build.sh we must (re)build it before start.
hooks:
  pre-start:
    - exec-host: |
        .ddev/openchamber/build.sh --if-needed
